<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>관리자 페이지</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50 text-gray-800 min-h-screen overflow-y-scroll">{% include 'partials/_nav.html' %}
<main class="max-w-5xl mx-auto px-4 py-8"><div id="denied" class="hidden bg-white rounded-2xl shadow-sm p-8 text-center"></div><div id="admin-content" class="hidden">
<section class="bg-white rounded-2xl shadow-sm p-7 mb-6"><div class="text-red-600 text-sm font-bold tracking-widest mb-2">ADMIN ONLY</div><h1 class="text-3xl font-bold">👑 관리자 페이지</h1><p id="admin-welcome" class="text-gray-500 mt-2"></p><span class="mt-4 inline-flex bg-red-50 text-red-600 px-3 py-1.5 rounded-full text-sm font-medium">관리자(2)</span></section>
<div class="flex gap-2 mb-5"><button id="member-tab" onclick="showTab('member')" class="px-4 py-2 rounded-lg bg-red-600 text-white font-medium">👥 회원 관리</button><button id="security-tab" onclick="showTab('security')" class="px-4 py-2 rounded-lg bg-white border text-gray-600 font-medium">🛡️ 보안 대시보드</button></div>
<section id="member-panel" class="bg-white rounded-xl shadow-sm overflow-hidden"><div class="p-5 border-b"><h2 class="text-xl font-bold">회원 관리</h2><p class="text-sm text-gray-500 mt-1">회원의 등급을 변경하거나 계정을 삭제할 수 있습니다.</p></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="text-left px-5 py-3">ID</th><th class="text-left px-5 py-3">아이디</th><th class="text-left px-5 py-3">현재 등급</th><th class="text-left px-5 py-3">등급 변경</th><th class="text-left px-5 py-3">관리</th></tr></thead><tbody id="user-rows" class="divide-y"></tbody></table></div></section>
<section id="security-panel" class="hidden"><div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-6"><div><h2 class="text-2xl font-bold">🛡️ 보안 대시보드</h2><p class="text-sm text-gray-500 mt-1">n8n 이 판정해 보낸 허용/거부 기록</p></div><div class="flex gap-2"><select id="student-filter" class="border rounded-lg px-3 py-2 text-sm"><option value="">전체 학생</option></select><button onclick="reloadSecurity()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm">새로고침</button></div></div>
<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6"><div class="bg-white rounded-xl shadow-sm p-4"><div class="text-xs text-gray-500">전체</div><div id="stat-total" class="text-2xl font-bold mt-1">-</div></div><div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-red-500"><div class="text-xs text-gray-500">거부 (deny)</div><div id="stat-deny" class="text-2xl font-bold mt-1 text-red-600">-</div></div><div class="bg-white rounded-xl shadow-sm p-4 border-l-4 border-emerald-500"><div class="text-xs text-gray-500">허용 (allow)</div><div id="stat-allow" class="text-2xl font-bold mt-1 text-emerald-600">-</div></div><div class="bg-white rounded-xl shadow-sm p-4"><div class="text-xs text-gray-500">최다 거부 IP</div><div id="stat-top-ip" class="text-lg font-bold mt-1 truncate">-</div></div></div>
<section class="bg-white rounded-xl shadow-sm p-4 mb-6"><h3 class="font-semibold mb-3">거부 상위 IP</h3><div id="top-ips" class="space-y-2 text-sm text-gray-500">불러오는 중…</div></section>
<section class="bg-white rounded-xl shadow-sm overflow-hidden"><div class="p-4"><h3 class="font-semibold">최근 이벤트</h3></div><div class="overflow-x-auto"><table class="w-full text-sm whitespace-nowrap"><thead class="bg-gray-50"><tr><th class="text-left px-4 py-2">#</th><th class="text-left px-4 py-2">학생</th><th class="text-left px-4 py-2">출발지 IP</th><th class="text-left px-4 py-2">판정</th><th class="text-left px-4 py-2">심각도</th><th class="text-left px-4 py-2">횟수</th><th class="text-left px-4 py-2">사유</th><th class="text-left px-4 py-2">저장 시각</th></tr></thead><tbody id="event-rows" class="divide-y"></tbody></table></div></section></section>
</div></main>
<script>
const token=localStorage.getItem('token'),username=localStorage.getItem('username'),role=localStorage.getItem('role'); const roleNames={0:'일반등급',1:'골드등급',2:'관리자'};
function logout(){localStorage.clear();location.href='/';} function updateNav(){const n=document.getElementById('auth-nav');if(n&&token&&username)n.innerHTML=`<span class="text-sm font-medium text-gray-700">${username} · ${roleNames[Number(role)]||'일반등급'}(${role||0})</span><a href="/" onclick="logout()" class="text-sm text-red-500 hover:underline">로그아웃</a>`;}
async function init(){updateNav();if(!token)return deny('로그인이 필요합니다.');const r=await fetch('/api/access/admin',{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok)return deny(d.msg||'접근 권한이 없습니다.');document.getElementById('admin-content').classList.remove('hidden');document.getElementById('admin-welcome').innerText=`${d.username} 관리자님, 회원 정보를 관리할 수 있습니다.`;loadUsers();}
function deny(msg){const d=document.getElementById('denied');d.classList.remove('hidden');d.innerHTML=`<div class="text-red-600 font-bold tracking-widest mb-3">ACCESS DENIED</div><h1 class="text-3xl font-bold mb-3">🔒 접근 권한이 없습니다</h1><p class="text-gray-500">${msg}</p>`;}
async function loadUsers(){const r=await fetch('/api/access/users',{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();document.getElementById('user-rows').innerHTML=(d.users||[]).map(u=>`<tr><td class="px-5 py-3">${u.id}</td><td class="px-5 py-3 font-medium">${u.username}</td><td class="px-5 py-3">${u.role_name}(${u.role})</td><td class="px-5 py-3"><select id="role-${u.id}" class="border rounded px-2 py-1" ${u.username===username?'disabled':''}><option value="0" ${u.role===0?'selected':''}>일반등급(0)</option><option value="1" ${u.role===1?'selected':''}>골드등급(1)</option><option value="2" ${u.role===2?'selected':''}>관리자(2)</option></select> <button onclick="changeRole(${u.id})" class="text-indigo-600 hover:underline" ${u.username===username?'disabled':''}>변경</button></td><td class="px-5 py-3"><button onclick="deleteUser(${u.id})" class="text-red-500 hover:underline" ${u.username===username?'disabled':''}>삭제</button></td></tr>`).join('');}
async function changeRole(id){const v=document.getElementById(`role-${id}`).value;const r=await fetch(`/api/access/users/${id}/role`,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({role:v})});const d=await r.json();alert(d.msg);if(r.ok)loadUsers();}
async function deleteUser(id){if(!confirm('정말 삭제하시겠습니까?'))return;const r=await fetch(`/api/access/users/${id}`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});const d=await r.json();alert(d.msg);if(r.ok)loadUsers();}
function showTab(tab){const member=tab==='member';document.getElementById('member-panel').classList.toggle('hidden',!member);document.getElementById('security-panel').classList.toggle('hidden',member);document.getElementById('member-tab').className='px-4 py-2 rounded-lg font-medium '+(member?'bg-red-600 text-white':'bg-white border text-gray-600');document.getElementById('security-tab').className='px-4 py-2 rounded-lg font-medium '+(!member?'bg-red-600 text-white':'bg-white border text-gray-600');if(!member)reloadSecurity();}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function studentParam(){const v=document.getElementById('student-filter').value;return v?`student=${encodeURIComponent(v)}`:'';}
async function loadStudents(){const r=await fetch('/api/security/students');const d=await r.json();const s=document.getElementById('student-filter');s.innerHTML='<option value="">전체 학생</option>'+(d.students||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');}
async function loadSummary(){const q=studentParam(),r=await fetch('/api/security/events/summary'+(q?'?'+q:'')),d=await r.json(),deny=d.by_decision?.deny||0,allow=d.by_decision?.allow||0;document.getElementById('stat-deny').textContent=deny;document.getElementById('stat-allow').textContent=allow;document.getElementById('stat-total').textContent=deny+allow;const tops=d.top_deny_ips||[];document.getElementById('stat-top-ip').textContent=tops.length?tops[0].src_ip:'-';document.getElementById('top-ips').innerHTML=tops.length?tops.map(t=>`<div>${esc(t.src_ip)} — ${t.fails}회</div>`).join(''):'<div class="text-gray-400">거부 기록이 없습니다.</div>';}
async function loadEvents(){const parts=[studentParam(),'limit=50'].filter(Boolean).join('&'),r=await fetch('/api/security/events?'+parts),d=await r.json();document.getElementById('event-rows').innerHTML=(d.events||[]).map(e=>`<tr><td class="px-4 py-2">${e.id}</td><td class="px-4 py-2">${esc(e.student)}</td><td class="px-4 py-2 font-mono">${esc(e.src_ip)}</td><td class="px-4 py-2">${e.decision==='deny'?'🚫 거부':'✅ 허용'}</td><td class="px-4 py-2">${esc(e.severity)}</td><td class="px-4 py-2">${e.fail_count}</td><td class="px-4 py-2">${esc(e.reason)}</td><td class="px-4 py-2">${esc((e.created_at||'').replace('T',' ').slice(0,19))}</td></tr>`).join('');}
function reloadSecurity(){loadStudents();loadSummary();loadEvents();} document.getElementById('student-filter').addEventListener('change',()=>{loadSummary();loadEvents();});init();
</script></body></html>
